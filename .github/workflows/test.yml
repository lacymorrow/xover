name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js and NPM
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: npm install
        run: |
          npm install

      - name: npm test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run lint
          npm exec tsc
          npm test

  # Playwright drives the built Electron bundle, so it needs `npm run build` and
  # a display. Jest needs neither, which is exactly how LAC-7782 hid: `test`
  # above stayed green for months while every spec using `test/helpers.ts` died
  # in `beforeAll`.
  #
  # Scoped to launch.spec.ts on purpose. The other specs now reach the app but
  # assert against a renderer that never mounts in this launch mode: the preload
  # path in src/main/create-window.ts resolves to `release/app/.erb/dll/preload.js`
  # when the app is built but unpackaged, so `window.electron` is undefined and
  # the React tree throws on `ipcRenderer`. That is a separate defect with its
  # own issue; adding those specs here before it is fixed would just pin the job
  # red. launch.spec.ts is what guards the regression this job exists for.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js and NPM
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: npm install
        run: npm install

      - name: Build main and renderer bundles
        run: npm run build

      - name: Playwright e2e
        run: xvfb-run --auto-servernum npx playwright test test/launch.spec.ts

      - name: Archive Playwright results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: test/results
          if-no-files-found: ignore
