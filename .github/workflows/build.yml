name: Build

on:
  push:
    branches:
      - main

jobs:
  # Each platform packages on its own runner. Windows used to ride along on the
  # macOS job, which built it for the host arch (arm64) and bundled the host's
  # rebuilt native modules into the Windows app: Mach-O binaries in
  # `build/Release`, which `node-gyp-build` reaches for before the `win32-x64`
  # prebuild. Both failures were silent. See LAC-7453.
  build-mac-windows:
    # To enable auto publishing to github, update your electron publisher
    # config in package.json > "build" and remove the conditional below
    if: ${{ github.repository_owner == 'lacymorrow' }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: package:mac
          - os: windows-latest
            package: package:windows

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Install Node and NPM
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm install
          npm run postinstall
          npm run ${{ matrix.package }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release
          path: |
            release/build
            !release/**/builder*
            !release/**/linux*
            !release/**/mac*
            !release/**/win*

  build-linux:
    # To enable auto publishing to github, update your electron publisher
    # config in package.json > "build" and remove the conditional below
    if: ${{ github.repository_owner == 'lacymorrow' }}

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Install Node and NPM
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: sudo apt install libarchive-tools

      - name: Install and build
        run: |
          npm install
          npm run postinstall
          npm run package:linux

      - name: Archive build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release
          path: |
            release/build
            !release/**/builder*
            !release/**/linux*
            !release/**/mac*
            !release/**/win*
